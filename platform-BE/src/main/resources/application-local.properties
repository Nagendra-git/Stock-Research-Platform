upstox.market-data.enabled=true
upstox.market-data.authorize-url=https://api.upstox.com/v3/feed/market-data-feed/authorize
upstox.market-data.market-start=09:15
upstox.market-data.market-end=15:30
upstox.market-data.time-zone=Asia/Kolkata
upstox.market-data.subscription-mode=full
upstox.market-data.redis-key-prefix=market-data
upstox.market-data.redis-ttl-hours=24
upstox.market-data.instrument-refresh-interval-seconds=60
upstox.market-data.reconnect.initial-delay-ms=2000
upstox.market-data.reconnect.max-delay-ms=30000
# ==============================
# Trading
# ==============================
trading.mode=${TRADING_MODE:PAPER}
trading.total-capital=${TRADING_TOTAL_CAPITAL:100000}
# At most 10% of total capital in any one stock
trading.max-capital-per-trade-percent=10
# At most 1% of total capital lost if stop-loss is hit
trading.risk-per-trade-percent=1
trading.max-open-positions=5
trading.default-stop-loss-percent=0.2
trading.default-target-percent=0.4
# D = Delivery/CNC
# I = Intraday/MIS
trading.default-product=D
# Set true + product=I for intraday safety-net square-off
trading.square-off-enabled=false
trading.square-off-time=15:15
trading.order-place-url=https://api-hft.upstox.com/v3/order/place
# ==============================
# Logging
# ==============================
logging.level.com.myapp.stock=INFO